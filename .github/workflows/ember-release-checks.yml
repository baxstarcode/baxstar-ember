name: Ember release checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ember-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Install Chromium and branded Chrome
        run: npx --no-install playwright install --with-deps chromium chrome
      - name: Build and run the full release suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:release 2>&1 | tee ember-release-checks.log
      - name: Record tested source and built payload
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > ember-tested-commit.txt
          git diff --stat > ember-generated-diff.txt
          if test -d dist; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > ember-payload-sha256.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ember-release-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            ember-release-checks.log
            ember-tested-commit.txt
            ember-generated-diff.txt
            ember-payload-sha256.txt
            dist/
